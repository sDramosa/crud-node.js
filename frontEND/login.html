<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Catálogo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="login-container">
        <div class="tarjeta" id="tarjeta-login">
            <h2>Bienvenido</h2>
            <p>Identificate e inicia sesión para acceder a las funciones CRUD de nuestro cátalogo de productos</p>
            
            <form id="form-login">
                <div class="form-group">
                    <label for="email">Correo electrónico</label>
                    <input type="email" id="email" required placeholder="ejemplo@correo.com">
                </div>
                
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" required placeholder="•••••••">
                </div>
                
                <button type="submit" class="btn-submit">Entrar</button>
            </form>
            
            <!-- Contenedor para mostrar errores si las credenciales fallan -->
            <div id="mensaje-error" class="error-mensaje"></div>
        </div>
    </div>

    <script src="login.js"></script>
</body>
</html>
